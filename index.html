<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Finanzas Privadas en la Nube</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MisFinanzas">
    <meta name="theme-color" content="#1a73e8">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/5501/5501375.png">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, where, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCY3MpqeibDMdrRFMynB6FaIZ0UUcmqGYQ",
            authDomain: "gestor-de-finanzas-554ac.firebaseapp.com",
            projectId: "gestor-de-finanzas-554ac",
            storageBucket: "gestor-de-finanzas-554ac.firebasestorage.app",
            messagingSenderId: "69922054305",
            appId: "1:69922054305:web:bcf7129aa34af3f4df10e0",
            measurementId: "G-Y4Z6D95ZPJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let movimientosActuales = [];
        let miGrafica = null;
        let idEdicion = null; // Variable para rastrear si estamos editando

        window.login = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            try { await signInWithEmailAndPassword(auth, email, pass); } 
            catch (error) { alert("Error: " + error.message); }
        };

        window.cerrarSesion = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('vista-login').style.display = 'none';
                document.getElementById('vista-app').style.display = 'block';
                cargarDatos(user.uid);
            } else {
                document.getElementById('vista-login').style.display = 'block';
                document.getElementById('vista-app').style.display = 'none';
            }
        });

        function cargarDatos(uid) {
            const q = query(collection(db, "movimientos"), where("userId", "==", uid), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                movimientosActuales = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                actualizarInterfaz(movimientosActuales);
            });
        }

        // --- FUNCIÓN PARA REGISTRAR O ACTUALIZAR ---
        window.guardarMovimiento = async () => {
            const monto = parseFloat(document.getElementById('monto').value);
            const concepto = document.getElementById('concepto').value;
            const categoria = document.getElementById('categoria').value || "General";
            const tipo = document.getElementById('tipo').value;
            
            if (!concepto || isNaN(monto)) return alert("Datos inválidos");

            const datos = {
                tipo: tipo,
                monto: monto,
                concepto: concepto,
                categoria: categoria.trim(),
            };

            if (idEdicion) {
                // Actualizar existente
                await updateDoc(doc(db, "movimientos", idEdicion), datos);
                idEdicion = null;
                document.getElementById('btn-guardar').innerText = "Guardar";
                document.getElementById('btn-guardar').style.background = "#1a73e8";
            } else {
                // Crear nuevo
                await addDoc(collection(db, "movimientos"), {
                    ...datos,
                    userId: auth.currentUser.uid,
                    fecha: new Date().toISOString().split('T')[0],
                    timestamp: new Date(),
                    mes: new Date().getMonth() + 1
                });
            }

            // Limpiar campos
            document.getElementById('monto').value = '';
            document.getElementById('concepto').value = '';
            document.getElementById('categoria').value = '';
        };

        // --- PREPARAR EDICIÓN ---
        window.prepararEdicion = (id) => {
            const mov = movimientosActuales.find(m => m.id === id);
            if (!mov) return;

            idEdicion = id;
            document.getElementById('monto').value = mov.monto;
            document.getElementById('concepto').value = mov.concepto;
            document.getElementById('categoria').value = mov.categoria;
            document.getElementById('tipo').value = mov.tipo;
            
            document.getElementById('btn-guardar').innerText = "Actualizar Registro";
            document.getElementById('btn-guardar').style.background = "#f39c12";
            window.scrollTo(0,0); // Subir para que el usuario vea el formulario
        };

        window.borrarMovimiento = async (id) => {
            if (confirm("¿Estás seguro de eliminar este registro?")) {
                try {
                    await deleteDoc(doc(db, "movimientos", id));
                } catch (error) {
                    alert("Error al borrar: " + error.message);
                }
            }
        };

        window.exportarCSV = () => {
            let csv = "Fecha,Concepto,Categoria,Tipo,Monto\n";
            movimientosActuales.forEach(m => csv += `${m.fecha},${m.concepto},${m.categoria},${m.tipo},${m.monto}\n`);
            const link = document.createElement("a");
            link.href = "data:text/csv;charset=utf-8," + encodeURI(csv);
            link.download = "Reporte_Finanzas.csv";
            link.click();
        };

        function actualizarInterfaz(movs) {
            const lista = document.getElementById('tabla-cuerpo');
            const listaCategorias = document.getElementById('lista-categorias-texto');
            let tin = 0, tout = 0, total = 0;
            const mesActual = new Date().getMonth() + 1;
            const categoriasGastos = {};

            lista.innerHTML = '';
            listaCategorias.innerHTML = '';

            movs.forEach(m => {
                const monto = parseFloat(m.monto);
                if(m.mes === mesActual) {
                    if(m.tipo === 'Entrada') tin += monto;
                    else {
                        tout += monto;
                        categoriasGastos[m.categoria] = (categoriasGastos[m.categoria] || 0) + monto;
                    }
                }
                total += (m.tipo === 'Entrada' ? monto : -monto);

                lista.innerHTML += `<tr>
                    <td>${m.fecha}</td>
                    <td>${m.concepto}<br><small>${m.categoria}</small></td>
                    <td class="${m.tipo==='Entrada'?'tipo-entrada':'tipo-salida'}">$${monto.toFixed(2)}</td>
                    <td style="white-space:nowrap;">
                        <button onclick="prepararEdicion('${m.id}')" style="background:none; color:#1a73e8; padding:0; width:auto; margin-right:10px;">✏️</button>
                        <button onclick="borrarMovimiento('${m.id}')" style="background:none; color:#e74c3c; padding:0; width:auto;">🗑️</button>
                    </td>
                </tr>`;
            });

            document.getElementById('res-in').innerText = `+$${tin.toFixed(2)}`;
            document.getElementById('res-out').innerText = `-$${tout.toFixed(2)}`;
            document.getElementById('saldo-total').innerText = `$${total.toFixed(2)}`;
            
            for (const [nombre, valor] of Object.entries(categoriasGastos)) {
                listaCategorias.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>${nombre}</span><strong>$${valor.toFixed(2)}</strong></div>`;
            }
            actualizarGrafica(categoriasGastos);
        }

        function actualizarGrafica(data) {
            const ctx = document.getElementById('miGrafica').getContext('2d');
            if (miGrafica) miGrafica.destroy();
            miGrafica = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(data),
                    datasets: [{
                        data: Object.values(data),
                        backgroundColor: ['#4285F4', '#EA4335', '#FBBC05', '#34A853', '#8E44AD', '#F39C12']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }
    </script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; padding: 15px; }
        .container { max-width: 900px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        input, select, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; box-sizing: border-box; }
        button { background: #1a73e8; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:active { opacity: 0.8; }
        .resumen-card { background: #1a73e8; color: white; text-align: center; }
        .tipo-entrada { color: #2ecc71; } .tipo-salida { color: #e74c3c; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
        .chart-container { height: 180px; position: relative; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div id="vista-login" class="card" style="max-width: 400px; margin: 50px auto; display:none;">
            <h2 style="text-align:center">🔐 Acceso</h2>
            <input type="email" id="email" placeholder="Correo">
            <input type="password" id="pass" placeholder="Contraseña">
            <button onclick="login()">Entrar</button>
        </div>

        <div id="vista-app" style="display:none">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h3 style="margin:0">📊 Mis Finanzas</h3>
                <button onclick="cerrarSesion()" style="width:auto; padding:5px 15px; background:#666;">Salir</button>
            </div>

            <div class="grid">
                <div class="card">
                    <select id="tipo"><option value="Salida">Gasto (-)</option><option value="Entrada">Ingreso (+)</option></select>
                    <input type="number" id="monto" placeholder="Monto $">
                    <input type="text" id="concepto" placeholder="Concepto">
                    <input type="text" id="categoria" placeholder="Categoría">
                    <button id="btn-guardar" onclick="guardarMovimiento()">Guardar</button>
                    <button onclick="exportarCSV()" style="background:#1d6f42;">📥 Excel</button>
                </div>
                <div class="card">
                    <div class="chart-container"><canvas id="miGrafica"></canvas></div>
                    <div id="lista-categorias-texto" style="margin-top:10px; font-size:0.9em;"></div>
                </div>
            </div>

            <div class="grid" style="grid-template-columns: repeat(3, 1fr); gap: 10px;">
                <div class="card" style="text-align:center; padding:10px;">Ingresos<br><span id="res-in" class="tipo-entrada">$0</span></div>
                <div class="card" style="text-align:center; padding:10px;">Gastos<br><span id="res-out" class="tipo-salida">$0</span></div>
                <div class="card resumen-card" style="padding:10px;">Saldo<br><h3 id="saldo-total" style="margin:0">$0</h3></div>
            </div>

            <div class="card" style="overflow-x:auto;">
                <table>
                    <thead><tr><th>Fecha</th><th>Detalle</th><th>Monto</th><th>Acción</th></tr></thead>
                    <tbody id="tabla-cuerpo"></tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Finanzas Pro PWA</title>
    
    <link rel="manifest" href="manifest.json">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a73e8">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/5501/5501375.png">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary: #1a73e8;
            --bg: #f0f2f5;
            --card-bg: rgba(255, 255, 255, 0.92);
            --text-main: #333333;
            --text-sec: #666666;
            --border: #dddddd;
            --nav-bg: #ffffff;
            /* Estilo Wall Street - Modo Claro (Azul sutil) */
            --pattern: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%231a73e8' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        [data-theme="dark"] {
            --bg: #121212;
            --card-bg: rgba(30, 30, 30, 0.92);
            --text-main: #e0e0e0;
            --text-sec: #b0b0b0;
            --border: #333333;
            --nav-bg: #1e1e1e;
            /* Estilo Wall Street - Modo Oscuro (Blanco tenue) */
            --pattern: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background-color: var(--bg);
            background-image: var(--pattern);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0; 
            transition: 0.3s; 
        }
        
        .container { max-width: 1100px; margin: auto; padding: 15px; position: relative; z-index: 1; }
        
        .card { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.1); 
            margin-bottom: 20px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        input, select, button { 
            width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; 
            border: 1px solid var(--border); font-size: 16px; box-sizing: border-box;
            background: var(--card-bg); color: var(--text-main);
        }
        button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        
        .tipo-entrada { color: #2ecc71; font-weight: bold; } 
        .tipo-salida { color: #ff5252; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; }
        td { padding: 12px 8px; border-bottom: 1px solid var(--border); }

        .desktop-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .full-width { grid-column: span 2; }

        .mobile-nav { display: none; }

        @media (max-width: 768px) {
            .desktop-layout { display: block; }
            .seccion-movil { display: none; }
            .seccion-movil.active { display: block; }
            body { padding-bottom: 80px; }
            
            .mobile-nav { 
                display: flex; position: fixed; bottom: 0; left: 0; right: 0; 
                background: var(--nav-bg); border-top: 1px solid var(--border); height: 70px; 
                justify-content: space-around; align-items: center; z-index: 100;
            }
            .nav-btn { background: none; color: var(--text-sec); font-size: 11px; border: none; width: auto; }
            .nav-btn.active { color: var(--primary); }
            .nav-btn b { font-size: 20px; display: block; }
        }
    </style>
</head>
<body>

        <div id="vista-login" class="card" style="max-width: 400px; margin: 50px auto; display:none;">
            <h2 style="text-align:center">🔐 Acceso</h2>
            <input type="email" id="email" placeholder="Correo">
            <input type="password" id="pass" placeholder="Contraseña">
            <button onclick="login()">Entrar</button>
        </div>

        <div id="vista-app" style="display:none">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 style="margin:0">📊 Mis Finanzas</h3>
                <div>
                    <button onclick="toggleTheme()" style="width:auto; background:none; border:none; font-size:20px; color:var(--text-main); cursor:pointer;">🌓</button>
                    <button onclick="cerrarSesion()" style="width:auto; padding:5px 10px; background:#666; font-size:12px; margin-left:10px;">Salir</button>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px;">
                <div class="card" style="text-align:center; padding:10px; margin:0;">Ingr.<br><span id="res-in" class="tipo-entrada">$0</span></div>
                <div class="card" style="text-align:center; padding:10px; margin:0;">Gast.<br><span id="res-out" class="tipo-salida">$0</span></div>
                <div class="card" style="text-align:center; padding:10px; margin:0; background:var(--primary); color:white; border:none;">Saldo<br><b id="saldo-total">$0</b></div>
            </div>

            <div class="desktop-layout">
                <div id="sec-formulario" class="seccion-movil">
                    <div class="card">
                        <h3 id="form-titulo" style="margin-top:0">Nuevo Registro</h3>
                        <select id="tipo"><option value="Salida">Gasto (-)</option><option value="Entrada">Ingreso (+)</option></select>
                        <input type="number" id="monto" placeholder="Monto $">
                        <input type="text" id="concepto" placeholder="Concepto">
                        <input type="text" id="categoria" placeholder="Categoría">
                        <button id="btn-guardar" onclick="guardarMovimiento()">Guardar</button>
                        <button onclick="exportarCSV()" style="background:#1d6f42; margin-top:10px;">📥 Excel</button>
                    </div>
                </div>

                <div id="sec-resumen" class="seccion-movil active">
                    <div class="card">
                        <h3 style="margin-top:0">Gastos por Categoría</h3>
                        <div style="height:220px;"><canvas id="miGrafica"></canvas></div>
                        <div id="lista-categorias-texto" style="margin-top:15px; font-size:0.9em; max-height: 150px; overflow-y: auto;"></div>
                    </div>
                </div>

                <div id="sec-lista" class="seccion-movil full-width">
                    <div class="card">
                        <h3 style="margin-top:0">Historial de Movimientos</h3>
                        <table>
                            <tbody id="tabla-cuerpo"></tbody>
                        </table>
                    </div>
                </div>
            </div> 
        </div> 
    </div> 

    <nav class="mobile-nav" id="mobile-nav" style="display:none;">
        <button class="nav-btn active" onclick="navegar('resumen', this)"><b>🏠</b>Inicio</button>
        <button class="nav-btn" onclick="navegar('formulario', this)"><b>➕</b>Nuevo</button>
        <button class="nav-btn" onclick="navegar('lista', this)"><b>📋</b>Lista</button>
    </nav>
